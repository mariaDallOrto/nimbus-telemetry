<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Nimbus Telemetria</title>
    <script>
      // SPA fallback for GitHub Pages: encode the path into a query string
      // and bounce to index.html, where the router restores the real URL.
      var pathSegmentsToKeep = 1;
      var location = window.location;
      location.replace(
        location.protocol +
          "//" +
          location.hostname +
          (location.port ? ":" + location.port : "") +
          location.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          location.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (location.search ? "&" + location.search.slice(1).replace(/&/g, "~and~") : "") +
          location.hash,
      );
    </script>
  </head>
  <body></body>
</html>
